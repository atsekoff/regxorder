name: Windows Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2

      - name: Build CLI share bundle
        shell: pwsh
        run: .\packaging\package-cli-share.ps1

      - name: Build UI release binary
        run: cargo build -p regxorder-ui --release

      - name: Stage release assets
        shell: pwsh
        run: |
          $releaseAssetsDirectory = Join-Path $PWD "dist\release-assets"
          New-Item -ItemType Directory -Path $releaseAssetsDirectory -Force | Out-Null
          Copy-Item -Path ".\dist\regxorder-cli-share.zip" -Destination (Join-Path $releaseAssetsDirectory "regxorder-cli-share.zip")
          Copy-Item -Path ".\target\release\regxorder-cli.exe" -Destination (Join-Path $releaseAssetsDirectory "regxorder-cli.exe")
          Copy-Item -Path ".\target\release\regxorder-ui.exe" -Destination (Join-Path $releaseAssetsDirectory "regxorder-ui.exe")

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: regxorder-windows-release
          path: dist/release-assets/*
          if-no-files-found: error

      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release-assets/regxorder-cli-share.zip
            dist/release-assets/regxorder-cli.exe
            dist/release-assets/regxorder-ui.exe
          generate_release_notes: true